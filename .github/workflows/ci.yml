name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same major version as infrastructure/docker (production uses 17).
        image: postgres:17-alpine
        # No password in the repo: the throwaway CI database trusts
        # connections (it is only reachable from this job's runner).
        env:
          POSTGRES_USER: sb_test
          POSTGRES_DB: space_booking_db_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sb_test -d space_booking_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The app reads DB_* (src/configuration/database.config.ts), not DATABASE_URL.
    # e2e requires a *_test database (test/setup-env.ts).
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sb_test
      # Empty: the service above uses trust auth (env validation only needs a string).
      DB_PASSWORD: ''
      DB_NAME: space_booking_db_test
      # JWT_SECRET is generated per run in the first step, never committed.
      # Empty = RabbitMQ disabled (outbox rows just stay unpublished).
      RABBITMQ_URL: ''

    steps:
      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=24.9 (Jest needs require(esm)).
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Migrate test database
        run: npm run migration:run
      - name: E2E tests
        # In band: the suites share one database.
        run: npm run test:e2e -- --runInBand
