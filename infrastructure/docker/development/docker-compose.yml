# Local services: PostgreSQL, pgAdmin, Redis, Mailpit.
# The API runs on your machine with `npm run start:dev`.
#
# From the repo root:
#   docker compose --env-file .env -f infrastructure/docker/development/docker-compose.yml up -d
#
# Values come from .env; the fallbacks below are local-dev defaults only.

name: space-booking

services:
  db:
    image: postgres:17-alpine
    env_file:
      - ../../../.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-space_booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-space_booking_dev}
      POSTGRES_DB: ${DB_NAME:-space_booking_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
