# Production stack: API (Docker image) + PostgreSQL + Redis + Loki + Alloy + Grafana.
# pgAdmin and Mailpit are dev-only and intentionally not here.
#
# From the repo root:
#   docker compose --env-file .env -f infrastructure/docker/production/docker-compose.yml up -d --build
#
# Secrets have no defaults (${VAR:?}): startup fails if they're missing.

name: space-booking-prod

x-logging: &default-logging
  # Alloy reads container logs through the Docker API, which needs the
  # json-file (or local) driver. Rotation keeps disk usage bounded.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: production
    image: space-booking-api:${IMAGE_TAG:-latest}
    env_file:
      - ../../../.env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Structured JSON to stdout, collected by Alloy. No file logging in Docker.
      LOG_FORMAT: json
      LOG_FILE: ""
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    # No published port: only reachable from inside the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  loki:
    image: grafana/loki:3.6.20
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
    # Not published: Alloy and Grafana reach it on the compose network.
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../monitoring/alloy/config.production.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to discover containers and read their logs.
      # Note: Docker socket access is powerful; keep this container trusted.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  loki_data:
  alloy_data:
  grafana_data:
